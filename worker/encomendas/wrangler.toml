# O WORKER DAS ENCOMENDAS DA LF MOBILE (docs/ENCOMENDAS.md, §7).
#
# Corre-se SEMPRE com --config apontado a este ficheiro (memória wrangler-autoconfig-pasta-mae: da
# pasta-mãe sem config, o wrangler inventa um Worker com o conteúdo de outro projecto). O wrangler
# está instalado na mimices-painel:
#   cd ~/Websites/mimices-painel && npx --no-install wrangler deploy --config ~/Websites/lfmobile/worker/encomendas/wrangler.toml
name = "lfmobile-encomendas"
main = "index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# As encomendas (encomenda.js diz as chaves). O título na Cloudflare é «lfmobile-encomendas-ORDERS»
# (o título «ORDERS», sem prefixo, é o do Armazém dos Pneus). Criado com:
#   wrangler kv namespace create lfmobile-encomendas-ORDERS --config …/wrangler.toml
[[kv_namespaces]]
binding = "ORDERS"
id = "b1609f701d5f43e7ad515c939b39ca6d"

# O travão do /checkout que vale em TODAS as localizações da Cloudflare (o de memória, em
# index.js, só vale no seu isolate): 5 pedidos por minuto por IP. O namespace_id é único na
# conta: 1001 e 1002 são do Carimbo, 1101 do Armazém dos Pneus.
[[ratelimits]]
name = "TRAVAO_CHECKOUT"
namespace_id = "1102"
simple = { limit = 5, period = 60 }

# Os cupões num objecto durável (cupoes.js, a classe Cupoes; um só para a loja, na jurisdição da UE —
# objecto.js): ler, conferir e contar um uso é um passo só, e dois clientes no mesmo instante nunca
# passam o limite (o KV não tem escrita condicional). SQLite: o único tipo do plano gratuito. Na
# primeira vez, o objecto traz do KV os cupões de antes. Localmente (wrangler dev), sem jurisdições:
# ENCOMENDAS_LOCAL=1 no .dev.vars, nunca aqui.
[[durable_objects.bindings]]
name = "CUPOES"
class_name = "Cupoes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cupoes"]

# Cada encomenda num objecto durável (objecto.js, a classe Encomenda; o nome é o id, na UE): a verdade
# dela, lida sempre a de agora, com escritas que conferem a versão (o KV fica com a cópia para a lista
# do painel). Com o KV, uma nota do painel logo a seguir a um pagamento voltava a pôr «pendente» por
# cima do «paga». As encomendas de antes lêem-se do KV até à primeira escrita.
[[durable_objects.bindings]]
name = "ENCOMENDA"
class_name = "Encomenda"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Encomenda"]

# O travão dos emails de encomendas por pagar (email.js, podeAvisarCliente): um contador por endereço
# (o nome é o resumo do email, na UE), no máximo 3 por dia a quem não pagou.
[[durable_objects.bindings]]
name = "CONTADOR"
class_name = "Contador"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Contador"]

# Os emails saem pela Cloudflare (Email Sending, desde 11 nov 2026): o domínio lfmobile.pt está no
# Email Sending da conta, e o plano Workers Paid deixa mandar a qualquer pessoa. Só deste remetente.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["encomendas@lfmobile.pt"]

[vars]
# O site no domínio (lfmobile.pt, desde 11 nov 2026). Este Worker vive no workers.dev, fora da zona:
# lê o site do domínio sem a restrição dos pedidos entre Workers da mesma zona (memória
# worker-na-mesma-zona).
SITE_URL = "https://lfmobile.pt"
CATALOGO_URL = "https://lfmobile.pt/assets/catalogo.json"
# A mesma imagem do topo do site (o PNG, que todos os clientes de email mostram). Se o logótipo
# mudar, o nome muda (leva a assinatura do ficheiro): copiar o novo do <img class="logo"> do
# _site/index.html.
LOGO_URL = "https://lfmobile.pt/assets/img/logo-b72d7bbaa1-128.png"
# As origens que podem chamar /checkout e /encomenda: só o domínio (a pré-visualização do GitHub
# Pages reencaminha para lá; os testes no Mac usam um Worker de faz-de-conta).
ALLOWED_ORIGINS = "https://lfmobile.pt"
STORE_NAME = "LF Mobile"
STORE_PHONE = "916 537 957"
# O email do dono: recebe só o que lhe pede alguma coisa («Nova encomenda», «Encomenda paga» e um
# pagamento numa encomenda anulada; o «expirou» e o «falhou» vão só ao cliente), e é o reply-to dos
# emails ao cliente. Vazio enquanto o dono não o der — e sem ele não se manda nada ao dono.
STORE_EMAIL = ""
# O remetente (o binding EMAIL só deixa este endereço).
MAIL_FROM = "LF Mobile <encomendas@lfmobile.pt>"
# A versão da API da Stripe, fixada (a mesma do Armazém dos Pneus). Não subir sem ler o changelog.
STRIPE_API_VERSION = "2026-07-29.dahlia"
# MODO = "encomenda" força o modo «encomenda» mesmo com o catálogo em «online» (travão de
# emergência). Por omissão não está definido: vale o catálogo.

# ---------------------------------------------------------------------------------------------
# SEGREDOS — nunca aqui (o repositório é público). Instalar com, por exemplo:
#   < ~/Websites/lfmobile/_cliente/segredos/PAINEL_SEGREDO npx --no-install wrangler secret put PAINEL_SEGREDO --config …
#   PAINEL_SEGREDO        o mesmo do Worker do painel (openssl rand -hex 32)
#   STRIPE_SECRET_KEY     sk_live_… ou rk_live_… da conta do cliente (quando a houver)
#   STRIPE_WEBHOOK_SECRET whsec_… do endpoint /stripe/webhook
#   RESEND_API_KEY        só sem o binding EMAIL: re_… de uma conta do Resend com o domínio verificado
# ---------------------------------------------------------------------------------------------
