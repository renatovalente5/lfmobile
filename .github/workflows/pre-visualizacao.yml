# A PRÉ-VISUALIZAÇÃO do site da LF Mobile, no GitHub Pages: https://renatovalente5.github.io/lfmobile/
#
# Enquanto não há domínio (o Renato: «só quando o site estiver pronto», 8 nov 2026), cada envio para a
# main constrói o site com --base=/lfmobile (noindex, dados legais por escrever como lembretes
# «[por confirmar: …]») e publica-o aqui, para o cliente ver e para o painel gravar. Os termos do
# GitHub Pages não deixam cá uma loja a vender: quando o domínio existir, o publicar.yml publica
# na Cloudflare (o Worker «lfmobile-site», wrangler.jsonc) e este workflow passa a pôr aqui uma
# página que reencaminha para o domínio (como na Mimices a 16 out 2026).
#
# O PAINEL (renatovalente5/lfmobile-painel) acompanha as corridas deste workflow até lá: o job
# «publicar» acabado bem quer dizer «publicado»; as razões de uma publicação parada são as
# anotações ::error do build.
name: Pré-visualização

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todos os dias às 00:15 de Lisboa: as promoções e o aviso do topo têm data de fim, e o site
  # só muda quando se publica.
  schedule:
    - cron: '15 23 * * *'

permissions: {}

# Uma publicação nova cancela a que está a correr: publica-se sempre o commit mais recente.
concurrency:
  group: pre-visualizacao
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a data de cada página no sitemap sai do histórico do git
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Guardar as imagens entre publicações
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/imagens
          key: imagens-${{ hashFiles('media/**', 'scripts/imagens.py', 'content/produtos/*.json') }}
          restore-keys: imagens-
      - name: Conferir as fotografias
        run: python scripts/imagens.py --verificar
      - name: Preparar as imagens
        run: python scripts/imagens.py
      # O travão: as regras, os scripts do browser, e construções de ensaio numa cópia (a
      # pré-visualização, a produção com os dados legais de faz-de-conta, as guardas). Se
      # falhar, fica no ar a publicação anterior.
      - name: Testar o gerador
        run: node scripts/testar.mjs
      - name: Construir a pré-visualização
        run: node scripts/build.mjs --base=/lfmobile --sem-imagens
      - name: Conferir o que sai
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "FALTA _site/index.html"; exit 1; }
          test -f _site/404.html   || { echo "FALTA _site/404.html"; exit 1; }
          test -z "$(find _site -name '*.md')" || { echo ".md NÃO devia ser publicado"; exit 1; }
          grep -q 'name="robots" content="noindex' _site/index.html || { echo "a pré-visualização tem de ser noindex"; exit 1; }
          echo "ok: $(find _site -type f | wc -l | tr -d ' ') ficheiros"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
